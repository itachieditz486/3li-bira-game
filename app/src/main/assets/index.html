  if(full){
    maxL=3;lives=3;score=0;girlFree=false;S.dmg=1;S.spd=1;S.reach=0;S.dj=0;
    mons=[mon(520,34,150),mon(1000,34,120),mon(1250,34,100),mon(1700,34,140),mon(1950,34,100),mon(2300,34,120),mon(2520,34,120),mon(2750,34,100)];
    const B=(x,r,hp,k)=>{const sc=[0,1.6,1.8,2.2][k],b=mon(x,64,r,hp,1);Object.assign(b,{kind:k,s:sc,w:64*sc,h:64*sc,y:GY-64*sc,np:k==3?3:2,cd:90,act:'',st:0,at:0,dv:0,ph:0,max:hp,fin:k==3,sleep:1,grow:1,ri:k-1});return b};
    const bl=[B(1150,100,12,1),B(1850,80,15,2),B(2950,100,22,3)];mons.push(...bl);boss=bl[2];rooms=RM.map((r,i)=>({...r,state:0,boss:bl[i]}));
    hearts=heartsDef.map(([x,y])=>({x,y,got:0}));
  }
}
function startIfIdle(){if(state==='title'||state==='over'||state==='win'){reset(true);state='play'}}

function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hurt(){
  if(hero.inv>0)return;
  lives--;hero.inv=100;shake=12;hero.vy=-8;hero.vx=-hero.dir*5;snd(300,60,.3,.22,'sawtooth');
  if(lives<=0){state='over';snd(220,30,1,.25,'sawtooth')}
}
function update(){
  t++;
  const h=hero;
  const mv=keys.right-keys.left;
  h.vx+=(mv*3.6*S.spd-h.vx)*(mv?.22:.3)*(h.ground?1:.75);
  if(Math.abs(h.vx)<.05)h.vx=0;
  if(mv)h.dir=mv;
  if(h.ground){coy=7;jumps=0}else if(coy>0)coy--;
  if(keys.jump&&!prevJump)jb=8;else if(jb>0)jb--;
  if(jb>0){if(coy>0){snd(300,650,.12,.1);h.vy=-12.4;coy=0;jb=0;h.ground=0;jumps=1}else if(S.dj&&jumps<2){snd(500,900,.12,.1);h.vy=-11;jumps=2;jb=0}}
  if(!keys.jump&&h.vy<-4)h.vy*=.86;
  prevJump=keys.jump;
  if(atkQ>0)atkQ--;if(h.acd>0)h.acd--;if((keys.atk||atkQ>0)&&h.atk<=0&&!(h.acd>0)){h.atk=16;h.acd=48;atkQ=0;snd(900,200,.1,.1,'sawtooth')}
  if(h.atk>0)h.atk--;
  if(h.inv>0)h.inv--;
  h.vy=Math.min(h.vy+.62,14);
  h.x+=h.vx;
  plats.forEach(p=>{if(hit(h,{x:p[0],y:p[1],w:p[2],h:p[3]})&&p[1]===GY&&h.y+h.h>p[1]+8){h.x-=h.vx}});
  h.x=Math.max(0,Math.min(LEVEL-h.w,h.x));
  h.y+=h.vy;h.ground=0;
  plats.forEach(p=>{
    if(h.x+h.w>p[0]&&h.x<p[0]+p[2]&&h.vy>=0&&h.y+h.h>=p[1]&&h.y+h.h-h.vy<=p[1]+6){h.y=p[1]-h.h;h.vy=0;h.ground=1}
  });
  if(h.y>H+60){hurt();if(state==='play'){reset(false);hero.inv=100}}
  // slash box
  const sw=h.atk>0?{x:h.dir>0?h.x+h.w-6:h.x-52-S.reach,y:h.y+4,w:58+S.reach,h:40}:null;
  mons.forEach(m=>{
    if(m.hp<=0||m.sleep)return;
    if(m.grow<1){m.grow=Math.min(1,m.grow+.02);return}
    if(!(m.big&&bossAI(m))){m.x+=m.vx;if(m.x<m.x0||m.x+m.w>m.x1+m.w){m.vx*=-1}}
    if(m.flash>0)m.flash--;
    const dmg=()=>{m.hp-=S.dmg;m.flash=18;score+=m.big?500:100;shake=m.big?8:3;snd(m.big?120:220,50,.18,.2,'square');if(m.kind&&m.hp>0){const np=Math.min(m.np-1,Math.floor((1-m.hp/m.max)*m.np));if(np>m.ph){m.ph=np;m.flash=40;shake=22;m.cd=40;m.act='';m.vx*=1.35;snd(90,25,.9,.3,'sawtooth');bn={t:170,a:NM[m.kind]+' EVOLVES!',b:UPG[m.kind][np]}}}if(m.hp<=0&&m.big){mons.forEach(q=>{if(!q.big)q.hp=0});if(m.fin)girlFree=true;else openUp()}};
    if(sw&&hit(sw,m)&&m.flash<=0){dmg();m.x+=h.dir*14}
    else if(hit(h,m)){
      if(h.vy>2&&h.y+h.h-m.y<20&&m.flash<=0){dmg();h.vy=-9.5}
      else if(m.flash<=0)hurt();
    }
  });
  hearts.forEach(c=>{if(!c.got&&Math.abs(c.x-(h.x+13))<22&&Math.abs(c.y-(h.y+22))<30){c.got=1;snd(800,1400,.12,.12,'triangle');score+=50;if(lives<5&&score%250===0)lives++}});
  rooms.forEach(r=>{if(r.state===0&&h.x>r.x0+90&&h.x<r.x1){r.state=1;const b=r.boss;b.sleep=0;b.grow=0;shake=26;snd(60,25,1.2,.35,'sawtooth');bn={t:170,a:NM[b.kind]+"'S LAIR",b:'The doors seal behind you...'}}
   if(r.state===1){h.x=Math.max(r.x0+12,Math.min(r.x1-12-h.w,h.x));if(r.boss.hp<=0){r.state=2;bn={t:130,a:'THE DOORS OPEN',b:''}}}});
  shots=shots.filter(o=>{if(o.t==='r'){if(o.w>0)o.w--;else{o.vy=Math.min(o.vy+.5,10);o.y+=o.vy}if(o.w<=0&&hit(h,{x:o.x-12,y:o.y-12,w:24,h:24})){hurt();return false}return o.y<GY}
 o.x+=o.vx;o.y+=o.vy;if(hit(h,{x:o.x-8,y:o.y-8,w:16,h:16})){hurt();return false}return o.y<GY&&o.y>-60&&Math.abs(o.x-h.x)<900});
  if(girlFree&&h.x>3180){state='win';score+=lives*300;arp([523,659,784,1047,1319])}
  {let tg=h.x-W/2+20+h.vx*14;const rl=rooms.find(r=>r.state===1);if(rl)tg=(rl.x0+rl.x1)/2-W/2;cam+=(Math.max(0,Math.min(LEVEL-W,tg))-cam)*.1}
  if(shake>0)shake--;
}

// ---------- drawing ----------
const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h)};
function bg(){
  const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#1b1342');gr.addColorStop(1,'#4a2a6b');g.fillStyle=gr;g.fillRect(0,0,W,H);
  for(let i=0;i<60;i++){const x=(i*97%W*1.3-cam*.1+W*2)%W,y=(i*53)%200;R(x,y,2,2,i%5?'#fff4d6aa':'#ffd166')}
  const mx=640-cam*.05;g.fillStyle='#fff4d6';g.beginPath();g.arc(mx,70,34,0,7);g.fill();g.fillStyle='#e7d3a8';g.beginPath();g.arc(mx-10,62,7,0,7);g.arc(mx+12,82,5,0,7);g.fill();
  g.fillStyle='#2b1b52';for(let i=0;i<12;i++){const x=i*140-(cam*.3%140);g.beginPath();g.moveTo(x,GY);g.lineTo(x+70,150+(i%3)*30);g.lineTo(x+140,GY);g.fill()}
  g.fillStyle='#22163f';for(let i=0;i<20;i++){const x=i*90-(cam*.6%90);R(x+38,GY-70-(i%3)*14,10,80,'#22163f');g.beginPath();g.arc(x+43,GY-76-(i%3)*14,26,0,7);g.fill()}
}
function drawHero(){
  const h=hero;if(h.inv>0&&(h.inv>>2)%2)return;
  const x=h.x,y=h.y,d=h.dir,bob=h.ground&&h.vx?Math.sin(t*.4)*2:0;
  const f=!h.ground?3:(Math.abs(h.vx)>.5?1+((t>>3)&1):0);g.save();g.translate(x+13,y+44);g.scale(d,1);g.drawImage(spr,f*24,0,24,46,-13,-51,26,51);g.restore();
  
  if(h.atk>0){const p=1-h.atk/16;g.save();g.translate(x+13,y+27);g.scale(d,1);g.rotate(-1.3+p*2.2);R(0,-3,54,7,'#e8f1ff');R(-4,-5,6,10,'#ffd166');g.restore();
    g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(x+13+d*6,y+27,44,d>0?-1.2:Math.PI-0.6+0.0,d>0?0.8:Math.PI+1.2);g.stroke()}
  else{R(x+(d>0?22:-8),y+27,12,4,'#e8f1ff');R(x+(d>0?20:-2),y+25,3,8,'#ffd166')}
}
function drawMon(m){
  if(m.hp<=0||m.sleep)return;if(m.kind){drawBoss(m);return}if(m.hp<m.max){R(m.x,m.y-9,m.w,5,'#000');R(m.x+1,m.y-8,(m.w-2)*m.hp/m.max,3,'#ff5d8f')}
  const x=m.x,y=m.y,w=m.w,h=m.h,c=m.flash>0&&m.flash%2?'#fff':(m.big?(m.fin?'#7a1fa2':m.x0<1500?'#d9822b':'#2b86d9'):(m.col||'#3fbf6a'));
  const sq=Math.sin(t*.2+x)*2;
  g.fillStyle=c;g.beginPath();g.ellipse(x+w/2,y+h/2+sq/2,w/2,h/2-sq/2+0,0,0,7);g.fill();
  R(x+w*.1,y+h-6,w*.2,6,c);R(x+w*.7,y+h-6,w*.2,6,c);
  const s=m.big?1.9:1;
  g.fillStyle=m.big?'#ffd166':'#c23a3a';
  g.beginPath();g.moveTo(x+w*.12,y+6);g.lineTo(x+w*.2,y-10*s);g.lineTo(x+w*.34,y+4);g.fill();
  g.beginPath();g.moveTo(x+w*.88,y+6);g.lineTo(x+w*.8,y-10*s);g.lineTo(x+w*.66,y+4);g.fill();
  R(x+w*.2,y+h*.3,w*.22,w*.2,'#fff');R(x+w*.58,y+h*.3,w*.22,w*.2,'#fff');
  const lx=m.vx>0?3:0;R(x+w*.28+lx,y+h*.36,w*.1,w*.1,'#111');R(x+w*.66+lx,y+h*.36,w*.1,w*.1,'#111');
  R(x+w*.25,y+h*.7,w*.5,4,'#111');for(let i=0;i<4;i++)R(x+w*.28+i*w*.12,y+h*.7,3,5,'#fff');
  if(m.big){for(let i=0;i<m.hp;i++)R(x+i*13,y-30,10,10,'#ff5d8f')}
}
function drawGirl(){
  const x=3230,y=GY-50;
  R(x+6,y+24,20,26,'#ff5d8f');R(x+10,y+46,5,4,'#f2c9a0');R(x+18,y+46,5,4,'#f2c9a0');
  R(x+7,y+6,18,18,'#f2c9a0');R(x+3,y+2,26,10,'#c0392b');R(x+2,y+8,6,22,'#c0392b');R(x+24,y+8,6,22,'#c0392b');
  R(x+11,y+14,3,3,'#222');R(x+19,y+14,3,3,'#222');R(x+13,y+20,7,2,'#c23a3a');
  R(x+12,y-6,10,6,'#ffd166');
  if(girlFree){const b=Math.sin(t*.2)*3;g.fillStyle='#ff5d8f';g.font='16px "Press Start 2P",monospace';g.fillText('♥',x+8,y-14+b)}
  else{for(let i=0;i<7;i++)R(x-4+i*6,y-8,3,64,'#9aa3b8');R(x-6,y-10,44,5,'#9aa3b8');R(x-6,GY-6,44,6,'#9aa3b8');
    g.fillStyle='#fff4d6';g.font='8px "Press Start 2P",monospace';g.fillText('HELP!',x-6,y-20+Math.sin(t*.2)*3)}
}
function draw(){
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  bg();
  g.save();g.translate(-Math.round(cam),0);drawRooms();
  plats.forEach(p=>{
    if(p[1]===GY){R(p[0],p[1],p[2],p[3],'#3b2a63');R(p[0],p[1],p[2],8,'#6bcb77');for(let i=0;i<p[2];i+=24)R(p[0]+i,p[1]+8,3,4,'#6bcb77')}
    else{R(p[0],p[1],p[2],p[3],'#8a5a3b');R(p[0],p[1],p[2],4,'#6bcb77')}
  });
  hearts.forEach(c=>{if(!c.got){const b=Math.sin(t*.1+c.x)*3;g.fillStyle='#ff5d8f';g.font='18px "Press Start 2P",monospace';g.fillText('♥',c.x-9,c.y+b)}});
  drawGirl();mons.forEach(drawMon);drawHero();drawShots();
  g.restore();g.restore();
  // HUD
  g.font='12px "Press Start 2P",monospace';g.fillStyle='#ff5d8f';
  g.drawImage(spr,3,0,18,23,8,3,28,36);for(let i=0;i<lives;i++)g.fillText('♥',54+i*22,30);R(54,38,70,5,'#00000099');R(54,38,70*(1-Math.max(0,hero.acd|0)/48),5,hero.acd>0?'#8a8fb0':'#ffd166');
  g.fillStyle='#ffd166';g.textAlign='right';g.fillText('SCORE '+score,W-14,28);g.textAlign='left';
  if(!girlFree&&hero.x>2600){g.fillStyle='#fff4d6';g.font='9px "Press Start 2P",monospace';g.fillText('Defeat the Dungeon Lord!',W/2-110,52)}
  if(girlFree){g.fillStyle='#fff4d6';g.font='9px "Press Start 2P",monospace';g.fillText('The cage is open! Run to her!',W/2-125,52)}
  if(bn&&bn.t>0){bn.t--;g.textAlign='center';g.fillStyle='#ff4d4d';g.font='14px "Press Start 2P",monospace';g.fillText(bn.a,W/2,92);g.fillStyle='#fff4d6';g.font='9px "Press Start 2P",monospace';g.fillText(bn.b,W/2,114);g.textAlign='left'}
}
function card(title,sub,col){
  g.fillStyle='#120d2bdd';g.fillRect(0,0,W,H);g.textAlign='center';
  g.fillStyle=col;g.font='28px "Press Start 2P",monospace';g.fillText(title,W/2,150);
  g.fillStyle='#fff4d6';g.font='11px "Press Start 2P",monospace';
  sub.forEach((s,i)=>g.fillText(s,W/2,200+i*26));g.textAlign='left';
}
let last=0,acc=0;
function loop(ts=0){
  acc+=Math.min(50,ts-last);last=ts;
  while(acc>=16.667){acc-=16.667;if(state==='play')update();else if(state==='up')upT++}
  if(state==='title'){t++;reset(true);hero.x=300;bg();draw();card('3LI BIRA',['The monsters took your girlfriend.','Cross the dark forest. Beat the Dungeon Lord.','Move: arrows/AD  Jump: Space  Sword: X','Press any key or tap to start'],'#ff5d8f')}
  else{draw();
    if(state==='up')drawUp();
    if(state==='over')card('GAME OVER',['The monsters won this round...','','Press any key or tap to try again'],'#ff5d8f');
    if(state==='win')card('YOU SAVED HER!',['Score: '+score,'Together at last. ♥','','Press any key or tap to play again'],'#ffd166')}
  requestAnimationFrame(loop);
}
reset(true);loop();
</script>
